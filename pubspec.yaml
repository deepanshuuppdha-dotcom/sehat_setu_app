name: sehat_setu
description: "SehatSetu — Offline-first AI triage app for rural India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  flutter_sound: ^9.16.3
  http: ^1.3.0
  provider: ^6.1.2
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  record: ^6.0.0
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true